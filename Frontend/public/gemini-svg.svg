<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#01030a" />
    </radialGradient>

    <!-- Vibrant Electric Gradient for "A" -->
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Vibrant Cyan-Blue Gradient for "I" -->
    <linearGradient id="gradI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38EF7D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Favicon Optimized Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base Mask for Favicon -->
  <g>
    <!-- Outer Border / Glowing Ring -->
    <circle cx="256" cy="256" r="250" fill="none" stroke="url(#rimGrad)" stroke-width="12" filter="url(#glow)" />

    <!-- Main Circular Background -->
    <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" />

    <!-- Subtle Tech Pattern Rings -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="#00F2FE" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="12, 12" />
    <circle cx="256" cy="256" r="200" fill="none" stroke="#00C6FF" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Neural Network Connection Web (Behind Text) -->
    <g opacity="0.35">
      <line x1="200" y1="130" x2="352" y2="175" stroke="#00F2FE" stroke-width="3" stroke-dasharray="6,6" />
      <line x1="200" y1="130" x2="352" y2="380" stroke="#00F2FE" stroke-width="2" />
      <line x1="256" y1="280" x2="352" y2="175" stroke="#38EF7D" stroke-width="3" />
      <line x1="120" y1="380" x2="256" y2="280" stroke="#00F2FE" stroke-width="3" />
    </g>

    <!-- LETTER "A" -->
    <g id="letter-A">
      <!-- "A" Outer Stroke Accent -->
      <path d="M 200 130 L 270 380 H 225 L 200 290 H 135 L 110 380 H 65 L 135 130 Z" fill="none" stroke="#00F2FE" stroke-width="12" opacity="0.25" filter="url(#glow)" />

      <!-- "A" Main Solid Body -->
      <path d="M 200 130 L 270 380 H 222 L 198 290 H 137 L 113 380 H 65 L 135 130 Z" fill="url(#gradA)" />

      <!-- "A" Inner Triangle Cutout -->
      <polygon points="167,185 186,250 148,250" fill="#030712" />

      <!-- Crossbar Tech Light Beam -->
      <line x1="137" y1="290" x2="198" y2="290" stroke="#38EF7D" stroke-width="6" filter="url(#glow)" />
    </g>

    <!-- LETTER "I" -->
    <g id="letter-I">
      <!-- "I" Outer Stroke Accent -->
      <path d="M 320 175 H 384 V 380 H 320 Z" fill="none" stroke="#00C6FF" stroke-width="12" opacity="0.25" filter="url(#glow)" />

      <!-- "I" Main Solid Body -->
      <path d="M 320 175 H 384 V 380 H 320 Z" fill="url(#gradI)" />

      <!-- "I" Tech Tittle (Glowing Dot Above) -->
      <circle cx="352" cy="125" r="28" fill="url(#gradA)" filter="url(#glow)" />
      <circle cx="352" cy="125" r="12" fill="#FFFFFF" />

      <!-- Vertical Tech Line Core -->
      <line x1="352" y1="175" x2="352" y2="380" stroke="#FFFFFF" stroke-width="3" opacity="0.6" />
    </g>

    <!-- Neural Circuit Nodes (Foreground Points) -->
    <g id="nodes">
      <!-- Node Top A -->
      <circle cx="200" cy="130" r="9" fill="#00F2FE" filter="url(#glow)" />
      <circle cx="200" cy="130" r="4" fill="#FFFFFF" />

      <!-- Node A-Left Base -->
      <circle cx="65" cy="380" r="7" fill="#00F2FE" />
      
      <!-- Node A-Right Base -->
      <circle cx="270" cy="380" r="7" fill="#00F2FE" />

      <!-- Node Crossbar Center -->
      <circle cx="256" cy="290" r="8" fill="#38EF7D" filter="url(#glow)" />

      <!-- Node Top I -->
      <circle cx="352" cy="175" r="8" fill="#00F2FE" filter="url(#glow)" />

      <!-- Node Bottom I -->
      <circle cx="352" cy="380" r="9" fill="#0072FF" filter="url(#glow)" />
      <circle cx="352" cy="380" r="4" fill="#FFFFFF" />
    </g>

    <!-- Subtle HUD Ring Overlay -->
    <path d="M 256 16 A 240 240 0 0 1 496 256" fill="none" stroke="#00F2FE" stroke-width="3" stroke-dasharray="30 15 10 15" opacity="0.4" />
  </g>
</svg>